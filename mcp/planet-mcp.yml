generated: '2026-07-20'
method: searched
status: published
source: https://github.com/planetlabs/planet-mcp
server:
  name: planet-mcp
  transport: stdio
  install: pip install planet-mcp
  run: planet-mcp
  auth: planet auth login
  official: true
  experimental: true
  repo: https://github.com/planetlabs/planet-mcp
  docs: https://docs.planet.com/develop/sdks/
description: >-
  Official experimental Model Context Protocol server from Planet, built on the
  Planet Python SDK. Runs locally over stdio and lets an AI agent (Claude Desktop,
  Claude Code, Gemini CLI, GitHub Copilot) interact with the Planet APIs. Tool
  groups are selectable via --include-tags / --exclude-tags flags.
tool_groups:
- orders
- subscriptions
- mosaics
- destinations
- download
- features
capabilities:
- Search recent imagery over an area of interest
- List and create feature collections
- Create and manage PlanetScope orders
- Manage subscriptions and cloud delivery destinations
clients:
- Claude Desktop
- Claude Code
- Gemini CLI
- GitHub Copilot
