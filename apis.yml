aid: planet
name: Planet
description: >-
  Planet Labs PBC operates the largest constellation of Earth-imaging satellites,
  capturing a daily scan of the planet's landmass and delivering that imagery,
  along with derived Planetary Variables and analytics, through a suite of public
  developer APIs. The Planet Platform exposes a Data API for searching the imagery
  catalog, an Orders API for requesting and delivering scenes, a Subscriptions API
  for continuous cloud delivery, a Basemaps API for mosaics, a Tasking API for
  commanding high-resolution SkySat and Pelican captures, and a Features API for
  managing areas of interest. All APIs are served from api.planet.com and secured
  with API keys (HTTP Basic) or OAuth2/OIDC through login.planet.com. Planet ships
  an official Python SDK and CLI, an experimental Model Context Protocol server,
  QGIS and ArcGIS plugins, and a large open-source notebook collection. Planet is a
  portfolio company of DCVC.
